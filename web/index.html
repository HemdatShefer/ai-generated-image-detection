<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RealityCheck, AI Generated Image Detection</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta2/css/all.min.css"
    integrity="sha512-YWzhKL2whUzgiheMoBFwW8CKV4qpHQAEuvilg9FAn5VJUDwKZZxkJNuGM4XkWuk94WCrrwslk8yWNGmY1EduTA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <div class="main" id="home">
    <div class="hero">
      <div class="hero__container">
        <h1 class="hero__heading">RealityCheck</h1>
        <p class="hero__description">Authentic or Synthetic</p>
      </div>
    </div>

    <div class="drag-area">
      <div class="icon">
        <i class="fas fa-cloud-upload-alt"></i>
      </div>

      <header>Drag & Drop to Upload File</header>
      <span>OR</span>
      <button type="button" id="browseButton">Browse File</button>
      <input type="file" id="fileInput" accept="image/jpeg, image/jpg, image/png" hidden />
    </div>

    <div class="zero">
      <div class="zero__container">
        <button type="button" id="checkButton">Reality check, please</button>

        <div class="dodel" id="resultModal">
          <div class="dodel-inner">
            <h3>Spoiler alert:</h3>
            <h3 style="display: inline-block;">It's </h3>
            <h4 id="resultLabel" style="display: inline-block;">Waiting for image</h4>
            <p id="resultConfidence"></p>
            <p id="resultError"></p>
            <button type="button" id="closeButton">Thanks</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
